name: Figure 1 publication preview

on:
  workflow_dispatch:
  push:
    paths:
      - "paper_figures/fig1_workflow.py"
      - "scripts/render_fig1_preview_ci.py"
      - ".github/workflows/figure1-preview.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Figure 1 dependencies
        run: python -m pip install -e .
      - name: Render Figure 1 PNG and vector PDF
        env:
          MPLBACKEND: Agg
        run: python scripts/render_fig1_preview_ci.py --outdir fig1_preview
      - name: Upload figure preview
        uses: actions/upload-artifact@v4
        with:
          name: clustro-figure1-preview
          path: |
            fig1_preview/fig1_workflow.png
            fig1_preview/fig1_workflow.pdf
          if-no-files-found: error

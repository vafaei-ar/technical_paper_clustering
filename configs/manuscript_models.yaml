      rationale: Coarser cluster-count sensitivity analysis.
    - name: sepsis_raw_kmeans_k3
      reduction: none
      clusterer: kmeans
      k: 3
      reference_seed: 11
      rationale: Raw-space representation sensitivity analysis.
  profiled:
    - name: sepsis_raw_kmeans_k2
      reduction: none
      clusterer: kmeans
      k: 2
      reference_seed: 11
      rationale: Raw-space two-cluster comparison retained for model profiling.
    - name: sepsis_raw_agg_k3
      reduction: none
      clusterer: agglomerative
      k: 3
      reference_seed: 11
      rationale: Raw-space agglomerative comparison retained for model profiling.
